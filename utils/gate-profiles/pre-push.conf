# Before pushing (about an hour): every stage, both thread modes, with the two
# longest stages cut down rather than dropped.
#
# Against full.conf plus full-mttcg.conf (1:07 + 0:37 = 1:44 for the pair) this
# runs the mode-insensitive stages once instead of twice, and cuts the vote to
# 20 tests per template (about 8 minutes rather than 40). It keeps both
# CheriBSD boots, round-robin and 4-hart MTTCG, because they exercise different
# code and each has caught its own bugs.
#
# The vote is sampling for disagreements with CHERI-Alliance QEMU, so fewer
# tests means a weaker sample, not a wrong verdict; the nightly full.conf run
# is what samples it properly. The trace stages still have both references:
# they do not depend on the thread mode, so they run once, as themselves, and
# Alliance judges alongside Sail exactly as in full.conf. (full-mttcg.conf
# drops Alliance because there every stage ran as an MTTCG run, which Alliance
# has nothing to compare with.)
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/pre-push.conf <qemu>
# shellcheck source=full.conf
. "$(dirname "$config")/full.conf"
MTTCG=both
VOTE_TESTS=20
