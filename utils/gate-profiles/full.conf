# Every stage, with the references in ~/Projects/CAPSTONE (refs/build-refs.sh
# builds the two reference QEMUs). Override any line on the command line,
# e.g. --skip cheribsd.
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/full.conf <qemu> 100
ALLIANCE_QEMU=$HOME/Projects/CAPSTONE/refs/alliance-qemu/build/qemu-system-riscv64xcheri
UPSTREAM_BUILD=$HOME/Projects/CAPSTONE/refs/upstream-qemu-10.2/build
ARCH_TEST=$HOME/Projects/CAPSTONE/refs/riscv-arch-test
CHERIBSD_OUTPUT=$HOME/Projects/CAPSTONE/cheri/output
ONLY=policy,regressions,bench,random,coverage,vote,cheribsd,upstream
# CHERI-Alliance QEMU crashes during caprandom (two runs, 2026-10-22/23), and
# the vote then skips every later template; leave caprandom to stage 4 (Sail).
VOTE_EXCLUDE='^caprandom$'
