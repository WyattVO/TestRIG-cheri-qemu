# Quick check with MTTCG (about two minutes): quick.conf, but the bench's
# QEMU_THREADS tests must really run under MTTCG as well as round-robin.
# That is the cheapest MTTCG coverage there is -- the bench stage takes about
# ten seconds either way, and requiring MTTCG is what runs the six smp-tag-*
# and tags-concurrent-mode tests, i.e. the ones a lock_tag change can break.
# Use it on every edit; full-mttcg.conf is the hour-long version.
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/quick-mttcg.conf <qemu>
# shellcheck source=quick.conf
. "$(dirname "$config")/quick.conf"
MTTCG=both
GATE_LOG_DIR=${GATE_LOG_DIR:-$HOME/Projects/CAPSTONE/reports/gate-runs}
