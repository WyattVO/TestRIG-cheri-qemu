# Before a commit on the QEMU 11.0 port: pre-commit.conf with upstream QEMU
# v11.0.0 as the stage 6 reference (refs/build-refs.sh upstream11 builds it).
# Without this, stage 6 would compare an 11.0 port against the 10.2 release it
# is no longer based on.
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/pre-commit-11.0.conf <qemu>
# shellcheck source=pre-commit.conf
. "$(dirname "$config")/pre-commit.conf"
UPSTREAM_BUILD=$HOME/Projects/CAPSTONE/refs/upstream-qemu-11.0/build
