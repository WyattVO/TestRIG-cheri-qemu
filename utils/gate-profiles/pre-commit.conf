# Before a commit (about ten minutes): everything that does not need a
# reference QEMU or a CheriBSD boot, with the random tests cut to 30 per
# template (they are linear in that number: 100 takes about ten minutes, 30
# about three) and bench run in both thread modes.
#
# What this deliberately leaves out, and why: cheribsd (6 min round-robin, 22
# min under MTTCG), vote (about 40 min, and it needs CHERI-Alliance QEMU) and
# selftest (needs CHERI-QEMU 7.1). Those are pre-push.conf's job. Coverage
# still runs, but 30 tests per template is below what coverage-required.txt
# expects of a full run, so treat a coverage failure here as "run more tests",
# not as a regression.
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/pre-commit.conf <qemu>
# shellcheck source=full.conf
. "$(dirname "$config")/full.conf"
unset ALLIANCE_QEMU SELFTEST_QEMU VOTE_EXCLUDE
ONLY=policy,regressions,bench,random,coverage,upstream
NTESTS=30
MTTCG=both
