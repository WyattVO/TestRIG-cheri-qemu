# Every stage, for a QEMU 10.2 port with MTTCG (the lock_tag series): the
# bench's QEMU_THREADS tests must really run under MTTCG (BENCH_MTTCG), and
# CheriBSD boots with four harts, which QEMU runs on four host threads
# (~20 min for both cheribsdtest suites; round-robin takes over 1.5 h).
# CHERI-Alliance QEMU has no MTTCG to compare with, so this profile leaves it
# out: Sail is the only reference for the trace stages, and the vote and the
# gate self-test (which needs Alliance) do not run. full.conf runs them.
#   utils/scripts/testrig-gate.sh --config utils/gate-profiles/full-mttcg.conf <qemu> 100
# shellcheck source=full.conf
. "$(dirname "$config")/full.conf"
unset ALLIANCE_QEMU
ONLY=policy,regressions,bench,random,coverage,cheribsd,upstream
BENCH_MTTCG=require
CHERIBSD_SMP=4
